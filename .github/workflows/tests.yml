# Checks the manifests and runs the unit tests on every push and pull
# request. The live and end-to-end tests are run by hand
# (npm run test:live, npm run test:e2e): they depend on Binance, Steam and a
# browser, and would fail for reasons that have nothing to do with the code.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tools/check-manifests.mjs

  unit:
    name: Unit tests (${{ matrix.extension }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Extensions with a package.json and tests. Add new ones here.
        extension: [steam-precios-ug]
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
